<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monticello</title>
    <link rel="stylesheet" href="./style.min.css" />
  </head>
  <body>
    <div class="wrapper">
      <header class="header">
        <div class="container header__container">
          <a class="header__logo" href="#"
            ><img class="header__logo-img" src="./img/logo.png" alt="logo"
          /></a>

          <nav class="nav header__nav">
            <ul class="nav__list">
              <li class="nav__item">
                <a class="nav__link" href="#">About Us</a>
              </li>
              <li class="nav__item">
                <a class="nav__link" href="#">Projects</a>
              </li>
              <li class="nav__item">
                <a class="nav__link" href="#">News</a>
              </li>
              <li class="nav__item">
                <a class="nav__link" href="#">Contact</a>
              </li>
            </ul>
          </nav>

          <div class="header__social">
            <ul class="social__list">
              <li class="social__item">
                <a class="social__link" href="#" aria-label="Facebook">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="40"
                    height="40"
                    viewBox="0 0 40 40"
                    fill="none"
                  >
                    <circle
                      opacity="0.4"
                      cx="20"
                      cy="20"
                      r="19.5"
                      stroke="white"
                    />
                    <path
                      d="M22 13h-2c-1.1 0-2 .9-2 2v2h-2v3h2v7h3v-7h2.1l.9-3h-3v-1.5c0-.3.2-.5.5-.5h2.5v-3z"
                      fill="white"
                    />
                  </svg>
                </a>
              </li>

              <li class="social__item">
                <a class="social__link" href="#" aria-label="Facebook">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="40"
                    height="40"
                    viewBox="0 0 40 40"
                    fill="none"
                  >
                    <circle
                      opacity="0.4"
                      cx="20"
                      cy="20"
                      r="19.5"
                      stroke="white"
                    />

                    <path
                      d="M28 15.3c-.7.3-1.4.5-2.2.6a3.7 3.7 0 001.6-2 7.3 7.3 0 01-2.3.9 3.6 3.6 0 00-6.2 3.3 10.2 10.2 0 01-7.4-3.7 3.6 3.6 0 001.1 4.8 3.6 3.6 0 01-1.6-.4v.1c0 1.7 1.2 3.3 2.9 3.7a3.7 3.7 0 01-1.6.1c.5 1.5 1.9 2.5 3.5 2.6a7.3 7.3 0 01-4.5 1.6c-.3 0-.6 0-.9-.1a10.3 10.3 0 005.6 1.7c6.7 0 10.4-5.5 10.4-10.4v-.5c.7-.5 1.3-1.1 1.8-1.8z"
                      fill="white"
                    />
                  </svg>
                </a>
              </li>

              <li class="social__item">
                <a class="social__link" href="#" aria-label="Facebook">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="40"
                    height="40"
                    viewBox="0 0 40 40"
                    fill="none"
                  >
                    <circle
                      opacity="0.4"
                      cx="20"
                      cy="20"
                      r="19.5"
                      stroke="white"
                    />

                    <path
                      d="M16 12h8c2.2 0 4 1.8 4 4v8c0 2.2-1.8 4-4 4h-8c-2.2 0-4-1.8-4-4v-8c0-2.2 1.8-4 4-4zm4 4a4 4 0 100 8 4 4 0 000-8zm5-2a1 1 0 11-2 0 1 1 0 012 0z"
                      fill="white"
                    />
                    />
                  </svg>
                </a>
              </li>
            </ul>
          </div>
          <section class="hero">
            <div class="hero__overlay"></div>
            <div class="hero__content">
              <h1 class="hero__title">Simple & Modern</h1>
              <p class="hero__subtitle">We make the world beautiful everyday</p>
            </div>
          </section>
        </div>
      </header>

      <footer class="footer"></footer>
    </div>
  </body>
</html>
